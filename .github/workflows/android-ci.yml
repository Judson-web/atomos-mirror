name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate embedded laptop dashboard JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('app/src/main/java/com/atomos/mirror/LocalReceiverServer.kt', 'utf8');
          const match = source.match(/private val DASHBOARD = """([\s\S]*?)"""\.trimIndent\(\)/);
          if (!match) throw new Error('Dashboard HTML block was not found');
          const scripts = [...match[1].matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if (scripts.length !== 1) throw new Error('Expected exactly one dashboard script, found ' + scripts.length);
          new Function(scripts[0][1]);
          for (const required of ['Generate pairing QR', 'Connect phone', 'playPcm', 'apply-quality']) {
            if (!match[1].includes(required)) throw new Error('Missing dashboard feature: ' + required);
          }
          console.log('Laptop dashboard JavaScript syntax and key controls verified.');
          NODE
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: atomos-mirror-debug
          path: app/build/outputs/apk/debug/app-debug.apk
