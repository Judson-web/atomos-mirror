name: Signed Release Candidate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atomos-signed-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release:
    name: Signed Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/atomos-signing"
          KEYSTORE="$RUNNER_TEMP/atomos-signing/atomos-release.keystore"
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            test -n "$ANDROID_KEYSTORE_PASSWORD"
            test -n "$ANDROID_KEY_ALIAS"
            test -n "$ANDROID_KEY_PASSWORD"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            echo "ANDROID_SIGNING_MATERIAL=provided" >> "$GITHUB_ENV"
          else
            STORE_PASS="$(openssl rand -hex 24)"
            KEY_PASS="$(openssl rand -hex 24)"
            ALIAS="atomos-release"
            keytool -genkeypair -noprompt -v \
              -keystore "$KEYSTORE" -storetype JKS \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 10000 \
              -dname "CN=Atomos Mirror Internal Testing, OU=Release, O=Atomos, C=IN"
            mkdir -p signing-material
            cp "$KEYSTORE" signing-material/
            {
              echo "KEEP THIS FILE PRIVATE. It is the signing identity for this APK."
              echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS"
              echo "ANDROID_KEY_ALIAS=$ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASS"
              echo "ANDROID_KEYSTORE_BASE64=$(base64 -w0 "$KEYSTORE")"
            } > signing-material/android-signing-secrets.txt
            (cd signing-material && zip -q -r "$RUNNER_TEMP/atomos-android-signing-material.zip" .)
            echo "ANDROID_SIGNING_MATERIAL=generated" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          fi
          echo "ATOMOS_SIGNING_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "ATOMOS_SIGNING_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ATOMOS_SIGNING_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ATOMOS_SIGNING_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "ATOMOS_SIGNING_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "ATOMOS_SIGNING_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
            echo "ATOMOS_SIGNING_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          fi
      - name: Build signed release APK
        run: gradle assembleRelease
      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p release-output
          cp "$APK" "release-output/Atomos-Mirror-Android-v1.1.0.apk"
          sha256sum release-output/*.apk > release-output/SHA256SUMS.txt
          echo "Android APK signature verified by apksigner."
      - name: Upload signed Android release
        uses: actions/upload-artifact@v4
        with:
          name: atomos-mirror-android-v1.1.0
          path: release-output/*
          retention-days: 30
      - name: Upload first-run Android signing material
        if: env.ANDROID_SIGNING_MATERIAL == 'generated'
        uses: actions/upload-artifact@v4
        with:
          name: atomos-mirror-android-signing-material
          path: ${{ runner.temp }}/atomos-android-signing-material.zip
          retention-days: 7

  windows-release:
    name: Signed Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package.json
      - name: Install desktop dependencies
        run: npm install
        working-directory: desktop
      - name: Run regression tests
        run: npm test
        working-directory: desktop
      - name: Prepare Windows code-signing certificate
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $signDir = Join-Path $env:RUNNER_TEMP "atomos-signing"
          New-Item -ItemType Directory -Force -Path $signDir | Out-Null
          $pfxPath = Join-Path $signDir "atomos-codesign.pfx"
          $cerPath = Join-Path $signDir "atomos-codesign.cer"
          if ($env:WINDOWS_CERT_PFX_BASE64) {
            if (-not $env:WINDOWS_CERT_PASSWORD) { throw "WINDOWS_CERT_PASSWORD is required with WINDOWS_CERT_PFX_BASE64." }
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
            $secure = ConvertTo-SecureString -String $env:WINDOWS_CERT_PASSWORD -Force -AsPlainText
            $imported = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $secure
            Export-Certificate -Cert $imported[0] -FilePath $cerPath | Out-Null
            "WINDOWS_SIGNING_MATERIAL=provided" | Out-File -FilePath $env:GITHUB_ENV -Append
            $password = $env:WINDOWS_CERT_PASSWORD
          } else {
            $password = [Convert]::ToHexString([Security.Cryptography.RandomNumberGenerator]::GetBytes(24))
            $secure = ConvertTo-SecureString -String $password -Force -AsPlainText
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Atomos Mirror Internal Testing" -CertStoreLocation Cert:\CurrentUser\My -KeyAlgorithm RSA -KeyLength 3072 -HashAlgorithm SHA256 -KeyExportPolicy Exportable -NotAfter (Get-Date).AddYears(5)
            Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $secure | Out-Null
            Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null
            $materialDir = Join-Path $env:RUNNER_TEMP "atomos-windows-signing-material"
            New-Item -ItemType Directory -Force -Path $materialDir | Out-Null
            Copy-Item $pfxPath $materialDir
            Copy-Item $cerPath $materialDir
            @(
              "KEEP THESE FILES PRIVATE. This is the signing identity for the internal test installer."
              "WINDOWS_CERT_PASSWORD=$password"
              "WINDOWS_CERT_PFX_BASE64=$([Convert]::ToBase64String([IO.File]::ReadAllBytes($pfxPath)))"
            ) | Set-Content -Path (Join-Path $materialDir "windows-signing-secrets.txt")
            Compress-Archive -Path (Join-Path $materialDir "*") -DestinationPath (Join-Path $env:RUNNER_TEMP "atomos-windows-signing-material.zip") -Force
            "WINDOWS_SIGNING_MATERIAL=generated" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          "CSC_LINK=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CSC_KEY_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ATOMOS_CERT_PATH=$cerPath" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build signed Windows installer
        run: npm run dist
        working-directory: desktop
      - name: Verify Authenticode signature and prepare release files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $env:GITHUB_WORKSPACE "desktop/dist"
          $installers = @(Get-ChildItem -Path $dist -Filter "*.exe" -File)
          if ($installers.Count -eq 0) { throw "No Windows installer was produced." }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
            if ($null -eq $signature.SignerCertificate -or $signature.Status -eq "NotSigned") {
              throw "Installer is not Authenticode-signed: $($installer.Name)"
            }
            Write-Host "$($installer.Name): signature present; certificate subject $($signature.SignerCertificate.Subject); status $($signature.Status)"
          }
          Copy-Item $env:ATOMOS_CERT_PATH $dist
          Get-FileHash -Algorithm SHA256 (Join-Path $dist "*.exe") |
            ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content (Join-Path $dist "SHA256SUMS.txt")
      - name: Upload signed Windows release
        uses: actions/upload-artifact@v4
        with:
          name: atomos-mirror-windows-v1.1.0
          path: |
            desktop/dist/*.exe
            desktop/dist/*.cer
            desktop/dist/SHA256SUMS.txt
          retention-days: 30
      - name: Upload first-run Windows signing material
        if: env.WINDOWS_SIGNING_MATERIAL == 'generated'
        uses: actions/upload-artifact@v4
        with:
          name: atomos-mirror-windows-signing-material
          path: ${{ runner.temp }}/atomos-windows-signing-material.zip
          retention-days: 7
