name: Android Signed Release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atomos-android-release-\${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-release:
    name: Build and verify Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: \${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: \${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: \${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: \${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/atomos-signing"
          KEYSTORE="$RUNNER_TEMP/atomos-signing/atomos-release.keystore"
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            test -n "$ANDROID_KEYSTORE_PASSWORD"
            test -n "$ANDROID_KEY_ALIAS"
            test -n "$ANDROID_KEY_PASSWORD"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            echo "ANDROID_SIGNING_MATERIAL=provided" >> "$GITHUB_ENV"
          else
            STORE_PASS="$(openssl rand -hex 24)"
            KEY_PASS="$(openssl rand -hex 24)"
            ALIAS="atomos-release"
            keytool -genkeypair -noprompt -v \
              -keystore "$KEYSTORE" -storetype JKS \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 10000 \
              -dname "CN=Atomos Mirror Internal Testing, OU=Release, O=Atomos, C=IN"
            mkdir -p signing-material
            cp "$KEYSTORE" signing-material/
            {
              echo "KEEP THIS FILE PRIVATE. It is the signing identity for this APK."
              echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS"
              echo "ANDROID_KEY_ALIAS=$ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASS"
              echo "ANDROID_KEYSTORE_BASE64=$(base64 -w0 "$KEYSTORE")"
            } > signing-material/android-signing-secrets.txt
            (cd signing-material && zip -q -r "$RUNNER_TEMP/atomos-android-signing-material.zip" .)
            echo "ANDROID_SIGNING_MATERIAL=generated" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          fi
          echo "ATOMOS_SIGNING_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "ATOMOS_SIGNING_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ATOMOS_SIGNING_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ATOMOS_SIGNING_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "ATOMOS_SIGNING_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "ATOMOS_SIGNING_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
            echo "ATOMOS_SIGNING_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          fi
      - name: Build signed release APK
        run: gradle assembleRelease
      - name: Verify APK signature and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p release-output
          cp "$APK" "release-output/Atomos-Mirror-Android-v1.2.0.apk"
          sha256sum release-output/*.apk > release-output/SHA256SUMS.txt
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: atomos-mirror-android-v1.2.0
          path: release-output/*
          retention-days: 30
      - name: Upload first-run signing identity
        if: env.ANDROID_SIGNING_MATERIAL == 'generated'
        uses: actions/upload-artifact@v4
        with:
          name: atomos-mirror-android-signing-material
          path: \${{ runner.temp }}/atomos-android-signing-material.zip
          retention-days: 7
